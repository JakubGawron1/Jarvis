[Distribution]
Distribution=arch
Architecture=x86-64
Mirror=https://geo.mirror.pkgbuild.com

[Output]
Format=disk
OutputDirectory=mkosi.output
ImageId=jarvis-linux

[Content]
Bootable=yes
Bootloader=systemd-boot
Hostname=jarvis-linux
RootPassword=jarvis
KernelCommandLine=rw quiet jarvis.boot=qemu
Packages=base
        linux
        linux-firmware
        systemd
        networkmanager
        plasma-desktop
        plasma-workspace
        sddm
        konsole
        dolphin
        chromium
        nodejs
        pnpm
        pipewire
        pipewire-pulse
        wireplumber
        noto-fonts
        sudo
        git
        vim
        qemu-guest-agent
        wmctrl

[Build]
WithNetwork=yes
ToolsTree=default
